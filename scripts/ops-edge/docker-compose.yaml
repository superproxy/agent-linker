# APISIX 数据面与 etcd。由 scripts/edge.sh 启动，不由网关进程生成。
# 管理密钥在 ${LINKAGENT_EDGE_DIR}/apisix-config.yaml，脚本启动前写入。
# 项目名由 scripts/edge.sh 的 -p linkagent-edge 传入。docker-compose 1.29 不接受顶层 name。
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
  apisix:
    image: linkagent-apisix:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - etcd
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 9080:9080
      - 127.0.0.1:9180:9180
    volumes:
      - ${LINKAGENT_EDGE_DIR}/apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
