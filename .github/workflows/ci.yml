name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: quality (typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build standalone package (smoke)
        run: pnpm build:dist

      - name: Build node package (smoke)
        run: node scripts/build-dist.mjs --target=node --skip-install
