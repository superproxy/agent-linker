# 端口代理服务配置
server:
  port: 9898
  host: 0.0.0.0

# nginx配置
nginx:
  enabled: true
  configDir: /etc/nginx/conf.d
  reloadCommand: nginx -s reload
  domainSuffix: dev.example.com

# frp配置
frp:
  enabled: true
  serverAddr: frp.example.com
  serverPort: 7000
  token: ""
  domainSuffix: frp.example.com
