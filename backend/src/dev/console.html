<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinkAgent · 控制台</title>
<style>
  :root {
    --bg: #0b0e14; --bg-soft: #11151f; --panel: #151b28; --panel-2: #1a2233;
    --line: #243049; --line-soft: #1d2740;
    --text: #e6ebf5; --text-dim: #93a1bd; --text-faint: #5d6b8a;
    --accent: #5b8cff; --accent-2: #37d5c9; --danger: #ff5d6c; --ok: #3ecf8e; --warn: #ffb454;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(91, 140, 255, .14), transparent 60%),
      radial-gradient(900px 420px at 95% -5%, rgba(55, 213, 201, .10), transparent 55%),
      var(--bg);
    color: var(--text); font-family: var(--sans); font-size: 14px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(11, 14, 20, .72); backdrop-filter: blur(8px); flex: 0 0 auto;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #0b0e14;
  }
  .brand b { font-size: 15px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--text-faint); font-size: 11px; margin-top: 1px; }
  .spacer { flex: 1; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-dim); background: var(--panel); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: rgba(62,207,142,.35); }
  .badge.err { color: var(--danger); border-color: rgba(255,93,108,.35); }
  #apiKeyBtn { font: inherit; font-size: 12px; color: var(--text-dim); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #apiKeyBtn:hover { border-color: var(--accent); color: var(--text); }

  main { display: flex; flex: 1 1 auto; min-height: 0; }

  /* 侧栏 */
  aside {
    width: 360px; flex: 0 0 auto; border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; background: rgba(11,14,20,.4);
  }
  .side-tabs { display: flex; gap: 4px; padding: 10px 12px 0; flex: 0 0 auto; }
  .side-tab {
    font: inherit; font-size: 12.5px; color: var(--text-dim);
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 6px 14px; cursor: pointer;
    transition: color .12s, background .12s, border-color .12s;
  }
  .side-tab:hover { color: var(--text); background: var(--panel); }
  .side-tab.on { color: var(--text); background: var(--panel-2); border-color: var(--line); }
  .side-tab .tab-count { font-family: var(--mono); font-size: 10.5px; margin-left: 5px; color: var(--accent-2); background: rgba(55,213,201,.12); border-radius: 999px; padding: 1px 7px; }
  .side-body { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .side-view { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .side-view.hidden { display: none; }
  .side-head {
    padding: 12px 16px 8px; font-size: 12px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .6px;
    display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto;
  }
  .side-head .head-title { display: flex; align-items: center; gap: 8px; }
  .hint-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(62,207,142,.8); }
  .icon-btn { background: none; border: none; color: var(--text-faint); font: inherit; font-size: 12px; cursor: pointer; padding: 3px 8px; border-radius: 6px; }
  .icon-btn:hover { color: var(--text); background: var(--panel); }
  .scroll { overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
  .empty-note { margin: 18px 10px; text-align: center; color: var(--text-faint); font-size: 12.5px; line-height: 1.7; }
  .empty-note .big { font-size: 14px; color: var(--text-dim); margin-bottom: 4px; }

  /* 用户卡片 */
  .user { border: 1px solid var(--line-soft); background: var(--panel); border-radius: var(--radius); padding: 11px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
  .user:hover { border-color: var(--line); background: var(--panel-2); }
  .user.active { border-color: var(--accent); background: linear-gradient(180deg, rgba(91,140,255,.10), rgba(91,140,255,.03)), var(--panel); }
  .user-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .user-id { font-weight: 650; font-size: 13.5px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-channel { font-family: var(--mono); font-size: 10px; color: var(--accent); background: rgba(91,140,255,.12); border: 1px solid rgba(91,140,255,.28); padding: 1px 7px; border-radius: 999px; flex: 0 0 auto; }
  .task-count { margin-left: auto; flex: 0 0 auto; font-size: 10.5px; font-family: var(--mono); color: var(--accent-2); background: rgba(55,213,201,.10); border: 1px solid rgba(55,213,201,.22); padding: 1px 8px; border-radius: 999px; }
  .user-meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--text-faint); }
  .user-meta .active-name { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* 用户详情（任务列表） */
  .detail { border-top: 1px solid var(--line-soft); background: rgba(17,21,31,.55); flex: 0 0 auto; display: flex; flex-direction: column; max-height: 46%; }
  .detail-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px 8px; flex: 0 0 auto; font-size: 12px; color: var(--text-dim); }
  .detail-head .who { font-family: var(--mono); color: var(--text); font-weight: 650; }
  .detail-head .spacer2 { flex: 1; }
  .task-list { overflow-y: auto; padding: 2px 12px 8px; display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; }
  .task { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-soft); background: var(--panel); border-radius: 10px; padding: 8px 10px; cursor: pointer; transition: border-color .12s, background .12s; min-width: 0; }
  .task:hover { border-color: var(--line); background: var(--panel-2); }
  .task.on { border-color: var(--accent-2); background: rgba(55,213,201,.06); }
  .task-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .task-agent { font-family: var(--mono); font-size: 10px; color: var(--warn); background: rgba(255,180,84,.1); border: 1px solid rgba(255,180,84,.25); padding: 1px 7px; border-radius: 999px; flex: 0 0 auto; }
  .on-pill { font-size: 10px; color: var(--ok); border: 1px solid rgba(62,207,142,.35); background: rgba(62,207,142,.1); padding: 1px 7px; border-radius: 999px; flex: 0 0 auto; }
  .task .ops { margin-left: auto; display: flex; gap: 2px; align-items: center; flex: 0 0 auto; }
  .task .ops button { background: none; border: none; color: var(--text-faint); font-size: 12px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  .task .ops button:hover { color: var(--text); background: var(--panel-2); }
  .task .ops button.danger:hover { color: var(--danger); }
  .new-task { display: flex; gap: 6px; align-items: center; padding: 8px 12px 12px; flex: 0 0 auto; }
  .new-task input { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; color: var(--text); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; outline: none; }
  .new-task input:focus { border-color: var(--accent); }
  .new-task select { font: inherit; font-size: 12px; font-family: var(--mono); color: var(--text); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px 6px; outline: none; flex: 0 0 auto; }
  .new-task select:focus { border-color: var(--accent); }

  /* Agents 面板 */
  .agents { overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .agent { border: 1px solid var(--line-soft); background: var(--panel); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: border-color .15s, background .15s; }
  .agent:hover { border-color: var(--line); background: var(--panel-2); }
  .agent.active { border-color: var(--accent); background: linear-gradient(180deg, rgba(91,140,255,.10), rgba(91,140,255,.03)), var(--panel); }
  .agent.disabled { opacity: .55; }
  .agent.disabled.active { opacity: 1; }
  .agent-top { display: flex; align-items: center; gap: 8px; }
  .agent-name { font-weight: 650; font-size: 14px; }
  .type-pill { font-family: var(--mono); font-size: 10px; color: var(--accent-2); background: rgba(55,213,201,.12); border: 1px solid rgba(55,213,201,.25); padding: 1px 7px; border-radius: 999px; }
  .state-pill { font-size: 10px; margin-left: auto; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-faint); white-space: nowrap; }
  .agent.enabled .state-pill { color: var(--ok); border-color: rgba(62,207,142,.3); background: rgba(62,207,142,.08); }
  .agent.disabled .state-pill { color: var(--warn); border-color: rgba(255,180,84,.3); }
  .agent-desc { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; }
  .model-row { margin-top: 10px; display: flex; gap: 6px; align-items: center; }
  .model-row select { flex: 1; min-width: 0; font: inherit; font-size: 12px; font-family: var(--mono); color: var(--text); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; outline: none; }
  .model-row select:focus { border-color: var(--accent); }
  .btn { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; transition: filter .12s, border-color .12s; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0e14; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: rgba(255,93,108,.35); }
  .btn.danger:hover { background: rgba(255,93,108,.1); border-color: var(--danger); }
  .agent-foot { margin-top: 8px; display: flex; gap: 6px; }
  .agent-foot .note { font-size: 11px; color: var(--text-faint); align-self: center; }

  /* 对话区 */
  section.chat { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .chat-head { padding: 10px 18px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); background: rgba(11,14,20,.4); flex: 0 0 auto; flex-wrap: wrap; }
  .chat-head .sep { color: var(--text-faint); }
  .chat-head code { font-family: var(--mono); color: var(--text); background: var(--panel); padding: 1px 8px; border-radius: 6px; }
  .chat-head code .mdl { color: var(--accent-2); }
  .chat-head .spacer2 { flex: 1; }
  #ctxBadge { font-family: var(--mono); font-size: 11px; color: var(--accent); background: rgba(91,140,255,.12); border: 1px solid rgba(91,140,255,.3); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  #ctxBadge.legacy { color: var(--text-faint); border-color: var(--line); background: var(--panel); }

  #messages { flex: 1 1 auto; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 860px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .msg .who { font-size: 11px; color: var(--text-faint); letter-spacing: .3px; }
  .bubble { line-height: 1.65; font-size: 14px; border-radius: 14px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .msg.user .bubble { background: linear-gradient(135deg, #24418f, #2350a8); color: #fff; border-top-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--line-soft); border-top-left-radius: 4px; }
  .bubble .thinking { color: var(--text-dim); font-size: 12.5px; border-left: 2px solid var(--accent-2); padding-left: 10px; margin: 0 0 8px; white-space: pre-wrap; opacity: .9; }
  .bubble .thinking-hint { display: inline-block; font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; border-radius: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  .error-line { align-self: center; font-size: 12px; color: var(--danger); background: rgba(255,93,108,.08); border: 1px solid rgba(255,93,108,.3); padding: 6px 12px; border-radius: 8px; }
  .empty-hint { margin: auto; text-align: center; color: var(--text-faint); }
  .empty-hint .big { font-size: 15px; margin-bottom: 6px; color: var(--text-dim); }

  .composer { flex: 0 0 auto; border-top: 1px solid var(--line-soft); padding: 12px 18px 14px; display: flex; gap: 10px; align-items: flex-end; background: rgba(11,14,20,.5); }
  .composer-box { flex: 1; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; transition: border-color .15s; }
  .composer-box:focus-within { border-color: var(--accent); }
  #input { width: 100%; border: none; outline: none; resize: none; background: transparent; color: var(--text); font: inherit; font-family: var(--sans); line-height: 1.6; max-height: 180px; min-height: 22px; }
  .composer-hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  #sendBtn { font: inherit; font-size: 14px; font-weight: 600; border: none; border-radius: 12px; padding: 11px 18px; cursor: pointer; background: linear-gradient(135deg, var(--accent), #3f74e8); color: #fff; }
  #sendBtn:disabled { opacity: .45; cursor: not-allowed; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #26304a; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--line-soft); max-height: 38vh; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">LA</div>
  <div class="brand">
    <b>LinkAgent · 控制台</b>
    <small>用户任务管理 + 切换 Agent / 模型并即时对话测试（OpenAI 兼容 /v1 亦对外开放）</small>
  </div>
  <div class="spacer"></div>
  <span class="badge" id="healthBadge">连接中…</span>
  <button id="apiKeyBtn" title="若网关开启了鉴权，需填写 Bearer token">API Key</button>
</header>

<main>
  <aside>
    <div class="side-tabs">
      <button class="side-tab on" id="tabUsers">用户<span class="tab-count" id="userCount">0</span></button>
      <button class="side-tab" id="tabAgents">Agents<span class="tab-count" id="agentCount">0</span></button>
    </div>

    <div class="side-body">
      <!-- 用户视图：用户列表 + 选中用户的任务 -->
      <div class="side-view" id="usersView">
        <div class="side-head">
          <span class="head-title">用户 <span class="hint-dot" title="从 /api/users 读取，每个用户含 channel/userId 与任务数"></span></span>
          <button class="icon-btn" id="usersRefresh" title="刷新用户列表">↻</button>
        </div>
        <div class="scroll" id="userList">
          <div class="empty-note">
            <div class="big">暂无用户</div>
            渠道消息（微信 / API 带 channel+userId）到达后自动建档<br />每个用户可拥有多个任务
          </div>
        </div>
        <div class="detail hidden" id="userDetail">
          <div class="detail-head">
            <span>任务</span>
            <span class="who" id="detailWho">-</span>
            <div class="spacer2"></div>
            <button class="btn ghost danger" id="delUserBtn" title="删除该用户全部状态（任务随用户一起删除）">删除用户</button>
          </div>
          <div class="task-list" id="taskList"></div>
          <div class="new-task">
            <input id="newTaskName" placeholder="新任务名称…" />
            <select id="newTaskAgent" title="任务绑定的 agent"></select>
            <button class="btn primary" id="newTaskBtn">新建</button>
          </div>
        </div>
      </div>

      <!-- Agents 视图 -->
      <div class="side-view hidden" id="agentsView">
        <div class="side-head"><span>Agents</span><span class="hint-dot" id="agentsDot" title="从 /api/agents 读取，当前启用状态"></span></div>
        <div class="scroll" id="agents"></div>
      </div>
    </div>
  </aside>

  <section class="chat">
    <div class="chat-head">
      <span id="ctxBadge" class="legacy">全局（未绑定用户任务）</span>
      <span id="activeType"></span>
      <code id="activeModelLine">agent:<span class="mdl" id="activeAgentId">-</span></code>
      <span class="sep">/</span>
      <code><span class="mdl" id="activeModelValue">-</span></code>
      <div class="spacer2"></div>
      <button class="icon-btn" id="clearBtn">清空对话</button>
    </div>
    <div id="messages">
      <div class="empty-hint">
        <div class="big">选择左侧 Agent 或用户任务，输入问题开始测试</div>
        <div>「用户」视图可管理各渠道用户及其任务；任务路由与微信 /v1 渠道完全一致</div>
      </div>
    </div>
    <div class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
        <div class="composer-hint" id="composerHint">绑定用户任务后发送将带 channel/userId/task（真实任务路由）；oneshot 会话</div>
      </div>
      <button id="sendBtn">发送</button>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  const AGENTS_KEY = 'linkagent.gw.apikey';

  const els = {
    tabUsers: $('#tabUsers'), tabAgents: $('#tabAgents'),
    userCount: $('#userCount'), agentCount: $('#agentCount'),
    usersView: $('#usersView'), agentsView: $('#agentsView'),
    userList: $('#userList'), usersRefresh: $('#usersRefresh'),
    userDetail: $('#userDetail'), detailWho: $('#detailWho'), delUserBtn: $('#delUserBtn'),
    taskList: $('#taskList'),
    newTaskName: $('#newTaskName'), newTaskAgent: $('#newTaskAgent'), newTaskBtn: $('#newTaskBtn'),
    agents: $('#agents'), agentsDot: $('#agentsDot'),
    health: $('#healthBadge'), ctxBadge: $('#ctxBadge'),
    activeType: $('#activeType'), activeAgentId: $('#activeAgentId'),
    activeModelLine: $('#activeModelLine'), activeModelValue: $('#activeModelValue'),
    messages: $('#messages'), input: $('#input'), sendBtn: $('#sendBtn'),
    apiKeyBtn: $('#apiKeyBtn'), clearBtn: $('#clearBtn'), composerHint: $('#composerHint'),
  };

  const state = {
    mode: 'users',            // 'users' | 'agents'（侧栏视图）
    agents: [],               // AgentDetail[]
    candidates: {},           // { [agentId]: string[] }
    activeId: null,           // agents 视图选中的 agent（legacy 对话上下文）
    users: [],                // UserSummary[]
    selectedUser: null,       // { channel, userId } | null
    userTasks: null,          // UserTasks | null（选中用户的任务状态）
    selectedTaskId: null,     // 当前对话绑定的任务 id
    busy: false,
    aborter: null,
    keys: { apiKey: localStorage.getItem(AGENTS_KEY) || '' },
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const qs = (o) => Object.entries(o).map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');

  /* ---------- API 封装 ---------- */
  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (state.keys.apiKey) headers['Authorization'] = `Bearer ${state.keys.apiKey}`;
    if (opts.body !== undefined && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    const res = await fetch(path, { ...opts, headers });
    if (res.status === 401) {
      await promptApiKey();
      return api(path, opts);
    }
    if (!res.ok) {
      let msg = `${res.status} ${res.statusText}`;
      try {
        const j = await res.json();
        msg = j?.error?.message || j?.error || msg;
      } catch {}
      throw new Error(msg);
    }
    return res.json();
  }
  async function promptApiKey() {
    const v = window.prompt('网关开启了鉴权：请输入 API Key（Bearer token，可留空取消）', state.keys.apiKey);
    if (v === null) throw new Error('未提供 API Key，无法访问');
    state.keys.apiKey = v.trim();
    localStorage.setItem(AGENTS_KEY, state.keys.apiKey);
  }

  /* ---------- 数据加载 ---------- */
  async function refresh() {
    const [agentsRes, candRes] = await Promise.all([api('/api/agents'), api('/api/agents/candidates')]);
    state.agents = agentsRes.agents;
    state.candidates = candRes.candidates || {};
    if (!state.agents.find((a) => a.id === state.activeId)) {
      const first = state.agents.find((a) => a.enabled) || state.agents[0];
      state.activeId = first ? first.id : null;
    }
    render();
    try { await refreshUsers(); } catch (e) { pushError(`加载用户列表失败：${e.message}`); }
  }

  async function refreshUsers() {
    const res = await api('/api/users');
    state.users = res.users || [];
    els.userCount.textContent = state.users.length;
    if (state.selectedUser) {
      const still = state.users.find((u) => u.channel === state.selectedUser.channel && u.userId === state.selectedUser.userId);
      if (!still) {
        state.selectedUser = null;
        state.userTasks = null;
        state.selectedTaskId = null;
        clearMessages('当前用户已不存在，请重新选择');
      }
    }
    renderUsers();
  }

  /* ---------- 渲染 ---------- */
  function render() {
    els.userCount.textContent = state.users.length;
    els.agentCount.textContent = state.agents.length;
    const usersOn = state.mode === 'users';
    els.tabUsers.classList.toggle('on', usersOn);
    els.tabAgents.classList.toggle('on', !usersOn);
    els.usersView.classList.toggle('hidden', !usersOn);
    els.agentsView.classList.toggle('hidden', usersOn);
    if (usersOn) renderUsers(); else renderAgents();
    updateContextMeta();
  }

  function renderAgents() {
    els.agents.innerHTML = '';
    for (const a of state.agents) els.agents.appendChild(agentCard(a));
  }

  function agentCard(a) {
    const card = document.createElement('div');
    card.className = `agent ${a.id === state.activeId ? 'active' : ''} ${a.enabled ? 'enabled' : 'disabled'}`;

    const top = document.createElement('div');
    top.className = 'agent-top';
    const name = document.createElement('span');
    name.className = 'agent-name';
    name.textContent = a.displayName;
    const pill = document.createElement('span');
    pill.className = 'type-pill';
    pill.textContent = a.type;
    const st = document.createElement('span');
    st.className = 'state-pill';
    st.textContent = a.enabled ? '启用' : '停用';
    top.append(name, pill, st);

    const desc = document.createElement('div');
    desc.className = 'agent-desc';
    desc.textContent = a.description || (a.model ? `默认模型：${a.model}` : '默认模型跟随 agent 自身');

    const row = document.createElement('div');
    row.className = 'model-row';
    const sel = document.createElement('select');
    sel.title = '切换该 Agent 的会话模型（仅内存，重启还原）';
    const current = a.model || '';
    const optDefault = document.createElement('option');
    optDefault.value = '';
    optDefault.textContent = '（不指定 → 由 agent 自行决定）';
    sel.appendChild(optDefault);
    if (current) {
      const cur = document.createElement('option');
      cur.value = current;
      cur.textContent = `${current}（当前）`;
      sel.appendChild(cur);
    }
    const cands = state.candidates[a.id] || [];
    if (cands.length) {
      const group = document.createElement('optgroup');
      group.label = '本机可用模型';
      for (const m of cands) {
        if (m === current) continue;
        const o = document.createElement('option');
        o.value = m;
        o.textContent = m;
        group.appendChild(o);
      }
      sel.appendChild(group);
    }
    sel.value = current;
    const applyBtn = document.createElement('button');
    applyBtn.className = 'btn primary';
    applyBtn.textContent = '应用模型';
    applyBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      await applyModel(a.id, sel.value, applyBtn);
    });
    row.append(sel, applyBtn);

    const foot = document.createElement('div');
    foot.className = 'agent-foot';
    const toggle = document.createElement('button');
    toggle.className = 'btn ghost';
    toggle.textContent = a.enabled ? '停用' : '启用';
    toggle.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      await toggleAgent(a.id, !a.enabled, toggle);
    });
    foot.appendChild(toggle);

    card.append(top, desc, row, foot);
    card.addEventListener('click', () => {
      if (!a.enabled) return;
      state.activeId = a.id;
      if (state.mode !== 'agents') {
        state.mode = 'agents';
        render();
      }
      clearMessages(`已切换到 agent:${a.id}（全局模式，未绑定用户任务）`);
    });
    return card;
  }

  async function applyModel(id, value, btn) {
    const m = value === '' ? null : value;
    const agent = state.agents.find((x) => x.id === id);
    if (agent && (agent.model || null) === m) return;
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '…';
    try {
      const res = await api(`/api/agents/${id}`, { method: 'PATCH', body: JSON.stringify({ model: m }) });
      const i = state.agents.findIndex((x) => x.id === res.agent.id);
      if (i >= 0) state.agents[i] = res.agent;
      render();
    } catch (e) {
      pushError(`应用模型失败：${e.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }
  async function toggleAgent(id, enabled, btn) {
    btn.disabled = true;
    try {
      const res = await api(`/api/agents/${id}`, { method: 'PATCH', body: JSON.stringify({ enabled }) });
      const i = state.agents.findIndex((x) => x.id === res.agent.id);
      if (i >= 0) state.agents[i] = res.agent;
      if (!enabled && state.activeId === id) {
        const first = state.agents.find((x) => x.enabled && x.id !== id) || state.agents.find((x) => x.enabled);
        state.activeId = first ? first.id : null;
      }
      render();
    } catch (e) {
      pushError(`切换失败：${e.message}`);
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------- 用户视图 ---------- */
  function renderUsers() {
    els.userList.innerHTML = '';
    if (state.users.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.innerHTML = '<div class="big">暂无用户</div>渠道消息（微信 / API 带 channel+userId）到达后自动建档<br />每个用户可拥有多个任务';
      els.userList.appendChild(empty);
    } else {
      for (const u of state.users) els.userList.appendChild(userCard(u));
    }
    renderUserDetail();
  }

  function userCard(u) {
    const card = document.createElement('div');
    const isActive = state.selectedUser && state.selectedUser.channel === u.channel && state.selectedUser.userId === u.userId;
    card.className = `user ${isActive ? 'active' : ''}`;

    const top = document.createElement('div');
    top.className = 'user-top';
    const id = document.createElement('span');
    id.className = 'user-id';
    id.textContent = u.userId;
    const ch = document.createElement('span');
    ch.className = 'user-channel';
    ch.textContent = u.channel;
    const cnt = document.createElement('span');
    cnt.className = 'task-count';
    cnt.textContent = `${u.taskCount} 个任务`;
    top.append(id, ch, cnt);

    const meta = document.createElement('div');
    meta.className = 'user-meta';
    const act = document.createElement('span');
    act.className = 'active-name';
    act.textContent = u.activeTaskId ? `激活：${u.activeTaskId}` : '无激活任务';
    const time = document.createElement('span');
    time.textContent = `最近活跃 ${relTime(u.updatedAt)}`;
    meta.append(act, time);

    card.append(top, meta);
    card.addEventListener('click', () => selectUser(u.channel, u.userId));
    return card;
  }

  function relTime(ts) {
    if (!ts) return '-';
    const diff = Date.now() - ts;
    if (diff < 60e3) return '刚刚';
    if (diff < 3600e3) return `${Math.floor(diff / 60e3)} 分钟前`;
    if (diff < 86400e3) return `${Math.floor(diff / 3600e3)} 小时前`;
    return new Date(ts).toLocaleDateString();
  }

  async function selectUser(channel, userId) {
    if (state.mode !== 'users') {
      state.mode = 'users';
      render();
    }
    if (state.busy) { state.aborter?.abort(); }
    const prevKey = ctxKey();
    state.selectedUser = { channel, userId };
    state.selectedTaskId = null;
    try {
      const data = await api(`/api/tasks?${qs({ channel, userId })}`);
      state.userTasks = data;
      state.selectedTaskId = data.activeTaskId || (data.tasks[0] && data.tasks[0].id) || null;
    } catch (e) {
      state.userTasks = null;
      state.selectedTaskId = null;
      pushError(`加载用户任务失败：${e.message}`);
    }
    render();
    if (ctxKey() !== prevKey) clearMessages(contextHint());
  }

  function renderUserDetail() {
    const u = state.selectedUser;
    if (!u) {
      els.userDetail.classList.add('hidden');
      return;
    }
    els.userDetail.classList.remove('hidden');
    els.detailWho.textContent = `${u.channel} / ${u.userId}`;
    els.taskList.innerHTML = '';

    const t = state.userTasks;
    if (!t) {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = '任务加载失败，请刷新';
      els.taskList.appendChild(empty);
      return;
    }
    if (t.tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.innerHTML = '<div class="big">暂无任务</div>输入名称并点击「新建」创建第一个任务';
      els.taskList.appendChild(empty);
    }
    for (const task of t.tasks) els.taskList.appendChild(taskRow(task));
  }

  function taskRow(task) {
    const row = document.createElement('div');
    const on = task.id === (state.selectedTaskId ?? state.userTasks.activeTaskId);
    row.className = `task ${on ? 'on' : ''}`;

    const name = document.createElement('span');
    name.className = 'task-name';
    name.title = task.id;
    name.textContent = task.name || task.id;
    const agent = document.createElement('span');
    agent.className = 'task-agent';
    agent.textContent = task.agentId;
    const ops = document.createElement('span');
    ops.className = 'ops';
    if (on) {
      const pill = document.createElement('span');
      pill.className = 'on-pill';
      pill.textContent = '激活';
      ops.appendChild(pill);
    } else {
      const use = document.createElement('button');
      use.textContent = '切换';
      use.title = '设为当前激活任务';
      use.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        await activateTask(task.id);
      });
      ops.appendChild(use);
    }
    const rename = document.createElement('button');
    rename.textContent = '✏️';
    rename.title = '重命名';
    rename.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const v = window.prompt('新任务名称：', task.name);
      if (v === null) return;
      try {
        const res = await api(`/api/tasks/${encodeURIComponent(task.id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ channel: state.selectedUser.channel, userId: state.selectedUser.userId, name: v.trim() }),
        });
        const i = state.userTasks.tasks.findIndex((x) => x.id === res.task.id);
        if (i >= 0) state.userTasks.tasks[i] = res.task;
        renderUsers();
      } catch (e) {
        pushError(`重命名失败：${e.message}`);
      }
    });
    ops.appendChild(rename);
    if (task.id !== 'default') {
      const del = document.createElement('button');
      del.textContent = '🗑';
      del.className = 'danger';
      del.title = '删除任务';
      del.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        if (!window.confirm(`确定删除任务「${task.name}」？`)) return;
        try {
          const res = await api(`/api/tasks/${encodeURIComponent(task.id)}?${qs({ channel: state.selectedUser.channel, userId: state.selectedUser.userId })}`, { method: 'DELETE' });
          state.userTasks.tasks = res.tasks;
          state.userTasks.activeTaskId = res.activeTaskId;
          state.selectedTaskId = res.activeTaskId;
          await refreshUsers();
          render();
        } catch (e) {
          pushError(`删除任务失败：${e.message}`);
        }
      });
      ops.appendChild(del);
    }

    row.append(name, agent, ops);
    row.addEventListener('click', () => activateTask(task.id));
    return row;
  }

  async function activateTask(taskId) {
    if (!state.selectedUser || !state.userTasks) return;
    const task = state.userTasks.tasks.find((t) => t.id === taskId);
    if (!task) return;
    if (taskId === state.selectedTaskId) {
      state.userTasks.activeTaskId = taskId;
      renderUsers();
      return;
    }
    const prevKey = ctxKey();
    try {
      await api(`/api/tasks/${encodeURIComponent(taskId)}/activate`, {
        method: 'PATCH',
        body: JSON.stringify({ channel: state.selectedUser.channel, userId: state.selectedUser.userId }),
      });
      state.userTasks.activeTaskId = taskId;
      state.selectedTaskId = taskId;
    } catch (e) {
      pushError(`切换任务失败：${e.message}`);
      return;
    }
    render();
    if (ctxKey() !== prevKey) clearMessages(contextHint());
  }

  async function createTask() {
    const name = els.newTaskName.value.trim();
    if (!name) { els.newTaskName.focus(); return; }
    if (!state.selectedUser) return;
    try {
      const agentId = els.newTaskAgent.value || undefined;
      await api('/api/tasks', {
        method: 'POST',
        body: JSON.stringify({ channel: state.selectedUser.channel, userId: state.selectedUser.userId, name, agentId }),
      });
      els.newTaskName.value = '';
      await selectUser(state.selectedUser.channel, state.selectedUser.userId);
    } catch (e) {
      pushError(`新建任务失败：${e.message}`);
    }
  }

  async function deleteUser() {
    const u = state.selectedUser;
    if (!u) return;
    if (!window.confirm(`确定删除用户「${u.channel} / ${u.userId}」？其全部任务状态将被删除，无法恢复。`)) return;
    try {
      await api(`/api/users/${encodeURIComponent(u.channel)}/${encodeURIComponent(u.userId)}`, { method: 'DELETE' });
      state.selectedUser = null;
      state.userTasks = null;
      state.selectedTaskId = null;
      clearMessages('用户已删除');
      await refreshUsers();
      render();
    } catch (e) {
      pushError(`删除用户失败：${e.message}`);
    }
  }

  /* ---------- 对话上下文 ---------- */
  function ctxKey() {
    if (state.mode === 'users' && state.selectedUser && state.selectedTaskId) {
      return `${state.selectedUser.channel}:${state.selectedUser.userId}:task:${state.selectedTaskId}`;
    }
    return state.mode === 'agents' && state.activeId ? `agent:${state.activeId}` : '';
  }

  function contextHint() {
    if (state.mode === 'users' && state.selectedUser && state.selectedTaskId) {
      const task = state.userTasks?.tasks.find((t) => t.id === state.selectedTaskId);
      return `已绑定用户 ${state.selectedUser.channel} / ${state.selectedUser.userId} 的任务「${task ? task.name : state.selectedTaskId}」→ agent:${task ? task.agentId : '-'}`;
    }
    if (state.mode === 'agents' && state.activeId) return `已切换到 agent:${state.activeId}（全局模式，未绑定用户任务）`;
    return '选择左侧用户任务或 Agent 开始';
  }

  function updateContextMeta() {
    const userCtx = state.mode === 'users' && state.selectedUser && state.selectedTaskId;
    const task = userCtx ? state.userTasks?.tasks.find((t) => t.id === state.selectedTaskId) : null;

    if (userCtx && state.selectedUser) {
      els.ctxBadge.textContent = `用户 ${state.selectedUser.channel}/${state.selectedUser.userId} · 任务 ${task ? task.name : state.selectedTaskId}`;
      els.ctxBadge.classList.remove('legacy');
      els.activeType.textContent = '用户任务';
      els.activeAgentId.textContent = task ? task.agentId : '-';
      els.activeModelValue.textContent = task ? task.agentId : '-';
      els.composerHint.textContent = `发送将带 channel=${state.selectedUser.channel} userId=${state.selectedUser.userId} task=${state.selectedTaskId}（真实任务路由；/task 命令同样生效）`;
      els.sendBtn.disabled = false;
      return;
    }
    const a = state.agents.find((x) => x.id === state.activeId);
    els.ctxBadge.textContent = '全局（未绑定用户任务）';
    els.ctxBadge.classList.add('legacy');
    if (!a) {
      els.activeAgentId.textContent = '-';
      els.activeModelValue.textContent = '-';
      els.activeType.textContent = '';
      els.composerHint.textContent = '绑定用户任务后发送将带 channel/userId/task（真实任务路由）；oneshot 会话';
      els.sendBtn.disabled = true;
      return;
    }
    els.activeType.textContent = a.enabled ? '当前会话' : '';
    els.activeAgentId.textContent = a.id;
    els.activeModelValue.textContent = a.model || 'agent 默认';
    els.composerHint.textContent = '全局模式：消息发往所选 Agent（不带 channel/userId）；oneshot 会话';
    els.sendBtn.disabled = false;
  }

  /* ---------- 对话 ---------- */
  function appendMessage(role, content) {
    const empty = els.messages.querySelector('.empty-hint');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? '你' : ctxLabel();
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'user') bubble.textContent = content;
    else bubble.dataset.assistant = '1';
    wrap.append(who, bubble);
    els.messages.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  function ctxLabel() {
    const userCtx = state.mode === 'users' && state.selectedUser && state.selectedTaskId;
    const task = userCtx ? state.userTasks?.tasks.find((t) => t.id === state.selectedTaskId) : null;
    if (userCtx) return `agent:${task ? task.agentId : '?'}`;
    return `agent:${state.activeId}`;
  }

  function streamInto(bubble, kind, delta) {
    let node = bubble.querySelector(`[data-stream="${kind}"]`);
    if (!node) {
      node = document.createElement('div');
      node.dataset.stream = kind;
      if (kind === 'reasoning') {
        node.className = 'thinking';
        node.appendChild(Object.assign(document.createElement('div'), { className: 'thinking-hint', textContent: '思考过程' }));
      }
      if (kind === 'content') {
        const text = document.createElement('div');
        text.dataset.body = '1';
        node.appendChild(text);
      }
      bubble.appendChild(node);
    }
    const body = kind === 'reasoning' ? node : node.querySelector('[data-body="1"]');
    body.textContent += delta;
    scrollBottom();
  }

  function scrollBottom() {
    els.messages.scrollTop = els.messages.scrollHeight;
  }
  function pushError(msg) {
    const empty = els.messages.querySelector('.empty-hint');
    if (empty) empty.remove();
    let line = els.messages.querySelector('.error-line');
    if (!line) {
      line = document.createElement('div');
      line.className = 'error-line';
      els.messages.appendChild(line);
    }
    line.textContent = msg;
    scrollBottom();
  }
  function clearError() {
    const line = els.messages.querySelector('.error-line');
    if (line) line.remove();
  }
  function clearMessages(hint) {
    if (state.busy) { state.aborter?.abort(); }
    els.messages.innerHTML = `<div class="empty-hint"><div class="big">${esc(hint || '会话已清空')}</div><div>选择左侧用户任务或 Agent 开始新一轮对话</div></div>`;
  }

  async function send() {
    const text = els.input.value.trim();
    // 按钮兼作“停止”：运行中点击则中断当前流
    if (state.busy) {
      state.aborter?.abort();
      return;
    }
    // 上下文校验：用户模式需选中任务；agent 模式需选中 agent
    const userCtx = state.mode === 'users' && state.selectedUser && state.selectedTaskId;
    const agentCtx = state.mode === 'agents' && state.activeId;
    if (!userCtx && !agentCtx) return;
    if (!text) return;
    clearError();

    const task = userCtx ? state.userTasks?.tasks.find((t) => t.id === state.selectedTaskId) : null;
    const agentId = userCtx ? (task ? task.agentId : state.activeId) : state.activeId;
    const history = collectedHistory(); // 先取历史，随后把本条 user 追加到 DOM
    appendMessage('user', text);
    els.input.value = '';
    autoGrow();

    const wrap = appendMessage('assistant', '');
    const bubble = wrap.querySelector('.bubble');
    state.busy = true;
    els.sendBtn.disabled = true;
    els.sendBtn.textContent = '停止';
    const model = `agent:${agentId}`;

    const aborter = new AbortController();
    state.aborter = aborter;

    let full = '';
    try {
      const body = {
        model,
        stream: true,
        messages: history.concat([{ role: 'user', content: text }]),
      };
      if (userCtx) {
        body.channel = state.selectedUser.channel;
        body.userId = state.selectedUser.userId;
        body.task = state.selectedTaskId;
      }
      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        signal: aborter.signal,
        headers: {
          'Content-Type': 'application/json',
          ...(state.keys.apiKey ? { Authorization: `Bearer ${state.keys.apiKey}` } : {}),
        },
        body: JSON.stringify(body),
      });
      if (res.status === 401) {
        await promptApiKey();
        throw new Error('鉴权失败，请重试发送');
      }
      if (!res.ok) {
        let msg = `${res.status}`;
        try { const j = await res.json(); msg = j?.error?.message || msg; } catch {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          let j;
          try { j = JSON.parse(payload); } catch { continue; }
          if (j.error) throw new Error(j.error.message || 'agent 流式返回错误');
          const choice = j.choices && j.choices[0];
          if (!choice) continue;
          const d = choice.delta || {};
          if (typeof d.reasoning_content === 'string' && d.reasoning_content) streamInto(bubble, 'reasoning', d.reasoning_content);
          if (typeof d.content === 'string' && d.content) {
            streamInto(bubble, 'content', d.content);
            full += d.content;
          }
          if (choice.finish_reason) break;
        }
      }
      if (!full && !bubble.querySelector('[data-stream]')) {
        bubble.textContent = '（agent 未返回内容）';
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        const t = bubble.querySelector('[data-stream="content"] [data-body="1"]');
        if (t) t.textContent += '\n\n[已停止]';
        else bubble.textContent = '[已停止]';
      } else {
        pushError(`请求失败：${e.message}`);
      }
    } finally {
      state.busy = false;
      state.aborter = null;
      els.sendBtn.textContent = '发送';
      els.sendBtn.disabled = false;
      updateContextMeta(); // 恢复按钮可用状态
    }
  }

  function collectedHistory() {
    const out = [];
    for (const node of els.messages.querySelectorAll('.msg')) {
      const who = node.querySelector('.who')?.textContent || '';
      if (who.startsWith('你')) {
        const b = node.querySelector('.bubble');
        out.push({ role: 'user', content: b ? b.textContent : '' });
      } else if (who.startsWith('agent:')) {
        const content = node.querySelector('[data-stream="content"] [data-body="1"]')?.textContent || '';
        if (content) out.push({ role: 'assistant', content });
      }
    }
    return out;
  }

  /* ---------- 输入交互 ---------- */
  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 180) + 'px';
  }
  els.input.addEventListener('input', autoGrow);
  els.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  els.clearBtn.addEventListener('click', () => { clearMessages(); });

  // 侧栏 tab 切换
  els.tabUsers.addEventListener('click', () => { state.mode = 'users'; render(); });
  els.tabAgents.addEventListener('click', () => { state.mode = 'agents'; render(); });
  els.usersRefresh.addEventListener('click', async () => {
    els.usersRefresh.disabled = true;
    try { await refreshUsers(); render(); } catch (e) { pushError(`刷新失败：${e.message}`); }
    finally { els.usersRefresh.disabled = false; }
  });
  els.newTaskBtn.addEventListener('click', createTask);
  els.newTaskName.addEventListener('keydown', (e) => { if (e.key === 'Enter') createTask(); });
  els.delUserBtn.addEventListener('click', deleteUser);

  /* ---------- 启动 ---------- */
  els.sendBtn.addEventListener('click', () => send());
  async function boot() {
    els.health.textContent = '连接中…';
    els.health.className = 'badge';
    try {
      await refresh();
      // 新建任务 agent 下拉：用 /api/agents 的可用 agent
      for (const a of state.agents) {
        const o = document.createElement('option');
        o.value = a.id;
        o.textContent = a.id;
        els.newTaskAgent.appendChild(o);
      }
      if (!els.newTaskAgent.value && state.agents.length) els.newTaskAgent.value = state.agents[0].id;
      els.health.textContent = '已连接';
      els.health.className = 'badge ok';
    } catch (e) {
      els.health.textContent = '连接失败';
      els.health.className = 'badge err';
      pushError(`无法加载 Agent 列表：${e.message}`);
    }
  }
  boot();
})();
</script>
</body>
</html>
