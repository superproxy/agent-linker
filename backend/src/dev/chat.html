<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinkAgent · 聊天</title>
<style>
  :root {
    --bg: #0b0e14; --bg-soft: #11151f; --panel: #151b28; --panel-2: #1a2233;
    --line: #243049; --line-soft: #1d2740;
    --text: #e6ebf5; --text-dim: #93a1bd; --text-faint: #5d6b8a;
    --accent: #5b8cff; --accent-2: #37d5c9; --danger: #ff5d6c; --ok: #3ecf8e; --warn: #ffb454;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(91, 140, 255, .14), transparent 60%),
      radial-gradient(900px 420px at 95% -5%, rgba(55, 213, 201, .10), transparent 55%),
      var(--bg);
    color: var(--text); font-family: var(--sans); font-size: 14px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(11, 14, 20, .72); backdrop-filter: blur(8px); flex: 0 0 auto;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #0b0e14;
  }
  .brand b { font-size: 15px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--text-faint); font-size: 11px; margin-top: 1px; }
  .spacer { flex: 1; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-dim); background: var(--panel); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: rgba(62,207,142,.35); }
  .badge.err { color: var(--danger); border-color: rgba(255,93,108,.35); }
  #apiKeyBtn { font: inherit; font-size: 12px; color: var(--text-dim); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #apiKeyBtn:hover { border-color: var(--accent); color: var(--text); }
  a.admin-link { font: inherit; font-size: 12px; color: var(--accent-2); text-decoration: none; border: 1px solid rgba(55,213,201,.3); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  a.admin-link:hover { background: rgba(55,213,201,.1); }

  main { display: flex; flex: 1 1 auto; min-height: 0; }

  /* 侧栏：Agent 列表（可折叠） */
  aside {
    width: 360px; flex: 0 0 auto; border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; background: rgba(11,14,20,.4);
    transition: width .22s ease;
  }
  body.sb-collapsed aside { width: 48px; }
  body.sb-collapsed .side-head { justify-content: center; padding: 12px 4px 8px; }
  body.sb-collapsed .side-head .head-title,
  body.sb-collapsed .side-head .icon-btn,
  body.sb-collapsed .side-head .task-filter,
  body.sb-collapsed .scroll,
  body.sb-collapsed .task-scroll { display: none; }
  .side-head {
    padding: 12px 16px 8px; font-size: 12px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .6px;
    display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto;
    gap: 6px;
  }
  .side-head .head-title { display: flex; align-items: center; gap: 8px; }
  .hint-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(62,207,142,.8); }
  .icon-btn { background: none; border: none; color: var(--text-faint); font: inherit; font-size: 12px; cursor: pointer; padding: 3px 8px; border-radius: 6px; }
  .icon-btn:hover { color: var(--text); background: var(--panel); }
  #collapseBtn { font-size: 11px; padding: 4px 8px; }
  .scroll { overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
  .empty-note { margin: 18px 10px; text-align: center; color: var(--text-faint); font-size: 12.5px; line-height: 1.7; }
  .empty-note .big { font-size: 14px; color: var(--text-dim); margin-bottom: 4px; }

  /* 任务面板：按用户分组展示持久任务会话 */
  .task-pane {
    border-bottom: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
    flex: 0 0 auto; max-height: 44%; min-height: 0;
  }
  /* 折叠侧栏时任务面板的展开入口（默认隐藏） */
  .expand-btn { display: none; }
  body.sb-collapsed .side-head .expand-btn { display: inline-block; }
  .task-pane .side-head { padding-bottom: 6px; }
  .task-filter {
    flex: 1 1 auto; min-width: 0; max-width: 150px;
    -webkit-appearance: none; appearance: none;
    background: var(--bg-soft); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 4px 8px; color: var(--text); font: inherit; font-size: 12px; text-transform: none; letter-spacing: 0;
  }
  .task-filter::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .task-filter::placeholder { color: var(--text-faint); }
  .task-filter:focus { outline: none; border-color: var(--accent); }
  .task-scroll { overflow-y: auto; overflow-x: hidden; padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; scrollbar-width: thin; scrollbar-color: #26304a transparent; }
  .user-group { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .user-group.open { border-color: var(--line); }
  .user-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none; }
  .user-head:hover { background: var(--panel-2); }
  .caret-ico { font-size: 9px; color: var(--text-faint); transition: transform .15s; display: inline-block; }
  .user-group.open .caret-ico { transform: rotate(90deg); }
  .u-name { font-family: var(--mono); font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .u-count { font-size: 10.5px; color: var(--text-faint); margin-left: auto; flex: 0 0 auto; }
  .u-add { font: inherit; font-size: 12px; line-height: 1; color: var(--text-faint); background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 6px; flex: 0 0 auto; }
  .u-add:hover { color: var(--text); background: var(--panel-2); }
  .user-tasks { display: none; flex-direction: column; gap: 6px; padding: 0 8px 8px; }
  .user-group.open .user-tasks { display: flex; }
  .task-item { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-soft); padding: 8px 10px; cursor: pointer; transition: border-color .12s, background .12s; }
  .task-item:hover { border-color: var(--line); background: var(--panel); }
  .task-item.active { border-color: var(--accent); background: rgba(91,140,255,.08); }
  .task-item.koff { opacity: .55; }
  .task-top { display: flex; align-items: center; gap: 6px; }
  .task-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .task-agent { font-family: var(--mono); font-size: 10px; color: var(--accent-2); background: rgba(55,213,201,.1); border: 1px solid rgba(55,213,201,.22); padding: 0 6px; border-radius: 999px; flex: 0 0 auto; }
  .task-key { font-size: 10px; color: var(--text-faint); margin-left: auto; font-family: var(--mono); flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .task-key.off { color: var(--warn); }
  .task-meta { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-ops { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
  .task-ops button { font: inherit; font-size: 10.5px; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
  .task-ops button:hover { color: var(--text); border-color: var(--accent); }
  .task-ops button.danger:hover { color: var(--danger); border-color: rgba(255,93,108,.5); }

  .agents { overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
  .agent { border: 1px solid var(--line-soft); background: var(--panel); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: border-color .15s, background .15s; }
  .agent:hover { border-color: var(--line); background: var(--panel-2); }
  .agent.active { border-color: var(--accent); background: linear-gradient(180deg, rgba(91,140,255,.10), rgba(91,140,255,.03)), var(--panel); }
  .agent.disabled { opacity: .55; }
  .agent-top { display: flex; align-items: center; gap: 8px; }
  .agent-name { font-weight: 650; font-size: 14px; }
  .type-pill { font-family: var(--mono); font-size: 10px; color: var(--accent-2); background: rgba(55,213,201,.12); border: 1px solid rgba(55,213,201,.25); padding: 1px 7px; border-radius: 999px; }
  .state-pill { font-size: 10px; margin-left: auto; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-faint); white-space: nowrap; }
  .agent.enabled .state-pill { color: var(--ok); border-color: rgba(62,207,142,.3); background: rgba(62,207,142,.08); }
  .agent.disabled .state-pill { color: var(--warn); border-color: rgba(255,180,84,.3); }
  .agent-desc { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; }
  .model-row { margin-top: 10px; display: flex; gap: 6px; align-items: center; }
  .model-row select { flex: 1; min-width: 0; font: inherit; font-size: 12px; font-family: var(--mono); color: var(--text); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; outline: none; }
  .model-row select:focus { border-color: var(--accent); }
  .btn { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; transition: filter .12s, border-color .12s; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0e14; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .agent-foot { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
  .agent-foot .note { font-size: 11px; color: var(--text-faint); }

  /* 对话区 */
  section.chat { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .chat-head { padding: 10px 18px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); background: rgba(11,14,20,.4); flex: 0 0 auto; flex-wrap: wrap; }
  .chat-head .sep { color: var(--text-faint); }
  .chat-head code { font-family: var(--mono); color: var(--text); background: var(--panel); padding: 1px 8px; border-radius: 6px; }
  .chat-head code .mdl { color: var(--accent-2); }
  .spacer2 { flex: 1; }

  #messages { flex: 1 1 auto; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
  .msg { display: flex; gap: 10px; max-width: 860px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 11px; font-weight: 800;
    margin-top: 2px; user-select: none;
  }
  .msg.user .avatar { background: linear-gradient(135deg, #4a67b3, #6f8fd9); color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.3); }
  .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b0e14; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.3); }
  .msg-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .msg.user .msg-body { align-items: flex-end; }
  .msg.assistant .msg-body { align-items: flex-start; }
  .who { font-size: 11px; color: var(--text-faint); letter-spacing: .3px; display: flex; align-items: baseline; gap: 8px; }
  .who .who-name { color: var(--text-dim); font-weight: 600; }
  .who .time { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); }
  .bubble {
    line-height: 1.65; font-size: 14px; border-radius: 14px; padding: 10px 14px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    box-shadow: 0 2px 8px rgba(0,0,0,.22);
  }
  .msg.user .bubble { background: linear-gradient(135deg, #24418f, #2350a8); color: #fff; border-top-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--line-soft); border-top-left-radius: 4px; }
  .bubble .thinking { color: var(--text-dim); font-size: 12.5px; border-left: 2px solid var(--accent-2); padding-left: 10px; margin: 0 0 8px; white-space: pre-wrap; opacity: .9; }
  .bubble .thinking-hint { display: inline-block; font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; border-radius: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  .error-line { align-self: center; font-size: 12px; color: var(--danger); background: rgba(255,93,108,.08); border: 1px solid rgba(255,93,108,.3); padding: 6px 12px; border-radius: 8px; }
  .empty-hint { margin: auto; text-align: center; color: var(--text-faint); }
  .empty-hint .big { font-size: 15px; margin-bottom: 6px; color: var(--text-dim); }

  .composer { flex: 0 0 auto; border-top: 1px solid var(--line-soft); padding: 12px 18px 14px; display: flex; gap: 10px; align-items: flex-end; background: rgba(11,14,20,.5); }
  .composer-box { flex: 1; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; transition: border-color .15s; }
  .composer-box:focus-within { border-color: var(--accent); }
  #input { width: 100%; border: none; outline: none; resize: none; background: transparent; color: var(--text); font: inherit; font-family: var(--sans); line-height: 1.6; max-height: 180px; min-height: 22px; }
  .composer-hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  #sendBtn { font: inherit; font-size: 14px; font-weight: 600; border: none; border-radius: 12px; padding: 11px 18px; cursor: pointer; background: linear-gradient(135deg, var(--accent), #3f74e8); color: #fff; }
  #sendBtn:disabled { opacity: .45; cursor: not-allowed; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #26304a; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--line-soft); max-height: 38vh; }
    body.sb-collapsed .side-head { justify-content: space-between; padding: 12px 16px 8px; }
    body.sb-collapsed .side-head .head-title,
    body.sb-collapsed .side-head .icon-btn,
    body.sb-collapsed .side-head .task-filter,
    body.sb-collapsed .scroll,
    body.sb-collapsed .task-scroll { display: revert; }
    /* 移动端侧栏恢复全宽展示，任务面板展开按钮不再需要 */
    body.sb-collapsed .side-head .expand-btn { display: none; }
  }
  @media (max-width: 620px) {
    header { padding: 10px 12px; gap: 10px; }
    .brand small, .badge { display: none; }
    #messages { padding: 14px; gap: 16px; }
    .msg { max-width: 100%; }
    .avatar { width: 26px; height: 26px; font-size: 10px; }
    .composer { padding: 10px 12px; }
    .chat-head { padding: 8px 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">LA</div>
  <div class="brand">
    <b>LinkAgent · 聊天</b>
    <small>选择 Agent 即时对话测试（OpenAI 兼容 /v1，oneshot 无状态）</small>
  </div>
  <div class="spacer"></div>
  <span class="badge" id="healthBadge">连接中…</span>
  <a class="admin-link" href="/admin">管理后台 →</a>
  <button id="apiKeyBtn" title="若网关开启了鉴权，需填写 Bearer token">API Key</button>
</header>

<main>
  <aside>
    <div class="task-pane">
      <div class="side-head">
        <span class="head-title">任务 <span class="hint-dot" title="从 /api/tasks/all 读取；点击任务进入该用户持久会话"></span></span>
        <input type="search" class="task-filter" id="taskFilter" placeholder="搜索用户…" title="按渠道或用户 ID 过滤" autocomplete="off" />
        <span style="display:flex;gap:2px;align-items:center;">
          <button class="icon-btn expand-btn" id="taskExpandBtn" title="展开侧栏">▦</button>
          <button class="icon-btn" id="taskNewBtn" title="新建任务（当前/展开用户）">+</button>
          <button class="icon-btn" id="taskRefreshBtn" title="刷新任务列表">↻</button>
        </span>
      </div>
      <div class="task-scroll" id="taskList">
        <div class="empty-note"><div class="big">加载任务…</div></div>
      </div>
    </div>
    <div class="side-head">
      <span class="head-title">Agents <span class="hint-dot" id="agentsDot" title="从 /api/agents 读取，当前启用状态"></span></span>
      <span style="display:flex;gap:2px;align-items:center;">
        <button class="icon-btn" id="agentsRefresh" title="刷新 Agent 列表">↻</button>
        <button class="icon-btn" id="collapseBtn" title="收起侧栏">«</button>
      </span>
    </div>
    <div class="scroll" id="agents"></div>
  </aside>

  <section class="chat">
    <div class="chat-head">
      <span id="ctxBadge" class="legacy">全局（未绑定用户任务）</span>
      <code>agent:<span class="mdl" id="activeAgentId">-</span></code>
      <span class="sep">/</span>
      <code><span class="mdl" id="activeModelValue">-</span></code>
      <div class="spacer2"></div>
      <button class="icon-btn" id="clearBtn">清空对话</button>
    </div>
    <div id="messages">
      <div class="empty-hint">
        <div class="big">选择左侧 Agent，输入问题开始测试</div>
        <div>oneshot 无状态会话；需要带用户/任务的持久路由请前往管理后台</div>
      </div>
    </div>
    <div class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
        <div class="composer-hint" id="composerHint">消息发往所选 Agent（不带 channel/userId）</div>
      </div>
      <button id="sendBtn">发送</button>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  const AGENTS_KEY = 'linkagent.gw.apikey';

  const els = {
    agents: $('#agents'), agentsDot: $('#agentsDot'), agentsRefresh: $('#agentsRefresh'),
    collapseBtn: $('#collapseBtn'),
    taskList: $('#taskList'), taskFilter: $('#taskFilter'), taskNewBtn: $('#taskNewBtn'), taskRefreshBtn: $('#taskRefreshBtn'), taskExpandBtn: $('#taskExpandBtn'),
    health: $('#healthBadge'), ctxBadge: $('#ctxBadge'),
    activeAgentId: $('#activeAgentId'), activeModelValue: $('#activeModelValue'),
    messages: $('#messages'), input: $('#input'), sendBtn: $('#sendBtn'),
    apiKeyBtn: $('#apiKeyBtn'), clearBtn: $('#clearBtn'), composerHint: $('#composerHint'),
  };

  /** 从 URL 解析任务上下文参数：/?channel=weixin&userId=xxx&task=t_xxx&agent=opencode 或 /?key=k_xxx */
  function parseCtx() {
    const p = new URLSearchParams(location.search);
    return {
      channel: (p.get('channel') || '').trim(),
      userId: (p.get('userId') || '').trim(),
      task: (p.get('task') || '').trim(),
      agent: (p.get('agent') || '').trim(),
      key: (p.get('key') || '').trim(),
    };
  }
  const ctx = parseCtx();
  /** 有 key（单 key 直连）或 channel+userId（三元素）即进入任务路由模式（管理后台「测试聊天」跳转而来） */
  const taskMode = Boolean(ctx.key || (ctx.channel && ctx.userId));

  const state = {
    agents: [],               // AgentDetail[]
    candidates: {},           // { [agentId]: string[] }
    activeId: null,           // 当前对话绑定的 agent
    busy: false,
    aborter: null,
    keys: { apiKey: localStorage.getItem(AGENTS_KEY) || '' },
    ctx,                      // 任务上下文参数（URL 传入，见 parseCtx）
    taskMode,                 // 任务路由模式：/v1 请求带 channel/userId/task/agent
    users: [],                // 任务面板数据：[{ channel, userId, activeTaskId, tasks }]（/api/tasks/all）
    expanded: undefined,      // 展开的用户分组 key：`${channel}|${userId}`（undefined=未初始化默认展开首个；null=全部收起）
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SB_KEY = 'linkagent.gw.sidebar';

  /* ---------- 侧栏折叠 ---------- */
  function setCollapsed(v) {
    document.body.classList.toggle('sb-collapsed', v);
    els.collapseBtn.textContent = v ? '»' : '«';
    els.collapseBtn.title = v ? '展开侧栏' : '收起侧栏';
    localStorage.setItem(SB_KEY, v ? '1' : '0');
  }
  els.collapseBtn.addEventListener('click', () => setCollapsed(!document.body.classList.contains('sb-collapsed')));
  setCollapsed(localStorage.getItem(SB_KEY) === '1');

  /* ---------- API 封装 ---------- */
  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (state.keys.apiKey) headers['Authorization'] = `Bearer ${state.keys.apiKey}`;
    if (opts.body !== undefined && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    const res = await fetch(path, { ...opts, headers });
    if (res.status === 401) {
      await promptApiKey();
      return api(path, opts);
    }
    if (!res.ok) {
      let msg = `${res.status} ${res.statusText}`;
      try {
        const j = await res.json();
        msg = j?.error?.message || j?.error || msg;
      } catch {}
      throw new Error(msg);
    }
    return res.json();
  }
  async function promptApiKey() {
    const v = window.prompt('网关开启了鉴权：请输入 API Key（Bearer token，可留空取消）', state.keys.apiKey);
    if (v === null) throw new Error('未提供 API Key，无法访问');
    state.keys.apiKey = v.trim();
    localStorage.setItem(AGENTS_KEY, state.keys.apiKey);
  }

  /* ---------- 数据加载 ---------- */
  async function refresh() {
    const [agentsRes, candRes, tasksRes] = await Promise.all([api('/api/agents'), api('/api/agents/candidates'), api('/api/tasks/all')]);
    state.agents = agentsRes.agents;
    state.candidates = candRes.candidates || {};
    state.users = tasksRes.users || [];
    if (!state.agents.find((a) => a.id === state.activeId)) {
      const first = state.agents.find((a) => a.enabled) || state.agents[0];
      state.activeId = first ? first.id : null;
    }
    renderAgents();
    renderTasks();
    updateContextMeta();
  }

  /* ---------- 任务面板 ---------- */
  function userKey(u) { return `${u.channel}|${u.userId}`; }

  /** taskMode 下锁定的用户（与当前 ctx 匹配） */
  function taskUser() {
    if (!state.taskMode || !state.ctx.channel) return null;
    return state.users.find((u) => u.channel === state.ctx.channel && u.userId === state.ctx.userId) || null;
  }

  /** 当前对话是否正处于该任务会话 */
  function isActiveTask(u, t) {
    if (!state.taskMode) return false;
    return u.channel === state.ctx.channel && u.userId === state.ctx.userId &&
      (t.id === state.ctx.task || t.key === state.ctx.key);
  }

  function opBtn(label, fn, cls) {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
    return b;
  }

  function renderTasks() {
    const el = els.taskList;
    el.innerHTML = '';
    const kw = (els.taskFilter?.value || '').trim().toLowerCase();
    let withTasks = state.users.filter((u) => u.tasks && u.tasks.length);
    if (kw) withTasks = withTasks.filter((u) => `${u.channel}/${u.userId}`.toLowerCase().includes(kw));
    if (!withTasks.length) {
      el.innerHTML = kw
        ? `<div class="empty-note"><div class="big">没有匹配的用户</div><div>关键词：${esc(kw)}</div></div>`
        : `<div class="empty-note"><div class="big">暂无用户任务</div><div>点击右上 + 为展开的用户新建任务</div></div>`;
      return;
    }
    // 锁定当前任务上下文对应的用户分组；否则保持手动展开状态（未初始化/已失效时默认首个）
    const locked = taskUser();
    if (locked && withTasks.includes(locked)) {
      state.expanded = userKey(locked);
    } else if (kw) {
      // 过滤态：匹配分组较少，自动展开唯一匹配；多个匹配保持各自当前状态，首个默认展开
      if (withTasks.length === 1) state.expanded = userKey(withTasks[0]);
      else if (state.expanded === undefined || (state.expanded && !withTasks.some((u) => userKey(u) === state.expanded))) {
        state.expanded = userKey(withTasks[0]);
      }
    } else if (state.expanded === undefined || (state.expanded && !withTasks.some((u) => userKey(u) === state.expanded))) {
      state.expanded = withTasks[0] ? userKey(withTasks[0]) : null;
    }
    for (const u of withTasks) el.appendChild(userGroup(u));
  }

  function userGroup(u) {
    const key = userKey(u);
    const open = state.expanded === key;
    const wrap = document.createElement('div');
    wrap.className = `user-group ${open ? 'open' : ''}`;

    const head = document.createElement('div');
    head.className = 'user-head';
    const caret = document.createElement('span');
    caret.className = 'caret-ico';
    caret.textContent = '▶';
    const name = document.createElement('span');
    name.className = 'u-name';
    name.textContent = `${u.channel}/${u.userId}`;
    const count = document.createElement('span');
    count.className = 'u-count';
    count.textContent = `${u.tasks.length} 任务`;
    const add = document.createElement('button');
    add.className = 'u-add';
    add.textContent = '+';
    add.title = '为该用户新建任务';
    add.addEventListener('click', (ev) => { ev.stopPropagation(); newTask(u); });
    head.append(caret, name, count, add);
    head.addEventListener('click', () => {
      state.expanded = state.expanded === key ? null : key;
      renderTasks();
    });

    const list = document.createElement('div');
    list.className = 'user-tasks';
    for (const t of u.tasks) list.appendChild(taskItem(u, t));

    wrap.append(head, list);
    return wrap;
  }

  function taskItem(u, t) {
    const active = isActiveTask(u, t);
    const keyOn = t.keyEnabled !== false;
    const item = document.createElement('div');
    item.className = `task-item ${active ? 'active' : ''} ${keyOn ? '' : 'koff'}`;

    const top = document.createElement('div');
    top.className = 'task-top';
    const name = document.createElement('span');
    name.className = 'task-name';
    name.textContent = t.name;
    const agent = document.createElement('span');
    agent.className = 'task-agent';
    agent.textContent = t.agentId;
    const key = document.createElement('span');
    key.className = `task-key ${keyOn ? '' : 'off'}`;
    key.textContent = keyOn ? t.key : `key 停用 · ${t.key}`;
    key.title = t.key;
    top.append(name, agent, key);

    const meta = document.createElement('div');
    meta.className = 'task-meta';
    meta.textContent = t.cwd ? `📂 ${t.cwd}` : (active ? '当前会话' : `id:${t.id}`);

    const ops = document.createElement('div');
    ops.className = 'task-ops';
    if (!active) ops.appendChild(opBtn('激活', () => activateTask(u, t)));
    ops.appendChild(opBtn('重命名', () => renameTask(u, t)));
    ops.appendChild(opBtn('Agent', () => changeAgent(u, t)));
    ops.appendChild(opBtn(keyOn ? '停用 key' : '启用 key', () => toggleKey(u, t)));
    ops.appendChild(opBtn('删除', () => removeTask(u, t), 'danger'));

    item.append(top, meta, ops);
    item.addEventListener('click', () => enterTask(u, t));
    return item;
  }

  /** 进入任务会话：更新任务上下文（key 启用时优先 key 直连，否则三元素路由） */
  function enterTask(u, t) {
    const keyOn = t.keyEnabled !== false;
    state.ctx = {
      channel: u.channel, userId: u.userId,
      task: t.id, agent: t.agentId,
      key: keyOn ? t.key : '',
    };
    state.taskMode = true;
    const target = state.agents.find((x) => x.id === t.agentId);
    if (target && target.enabled) state.activeId = target.id;
    renderAgents();
    renderTasks();
    updateContextMeta();
    clearMessages(`已进入任务「${t.name}」(${u.channel}/${u.userId}${keyOn ? ' · key 直连' : ' · 三元素路由'})，持久会话有记忆`);
  }

  async function newTask(u) {
    const name = window.prompt(`新建任务（${u.channel}/${u.userId}）：输入任务名称`, '');
    if (name === null) return;
    const active = u.tasks.find((t) => t.id === u.activeTaskId);
    const agentId = window.prompt('绑定 Agent（可留空继承激活任务）：', active?.agentId || '');
    if (agentId === null) return;
    try {
      const task = await api('/api/tasks', {
        method: 'POST',
        body: JSON.stringify({ channel: u.channel, userId: u.userId, name: name.trim(), agentId: agentId.trim() || undefined }),
      });
      await refresh();
      if (task?.id) {
        const created = state.users.find((x) => userKey(x) === userKey(u))?.tasks.find((t) => t.id === task.id);
        if (created) enterTask(u, created);
      }
    } catch (e) { pushError(`新建任务失败：${e.message}`); }
  }

  async function renameTask(u, t) {
    const v = window.prompt('新任务名称：', t.name);
    if (v === null || !v.trim()) return;
    try {
      await api(`/api/tasks/${encodeURIComponent(t.id)}`, {
        method: 'PATCH',
        body: JSON.stringify({ channel: u.channel, userId: u.userId, name: v.trim() }),
      });
      await refresh();
    } catch (e) { pushError(`重命名失败：${e.message}`); }
  }

  async function changeAgent(u, t) {
    const names = state.agents.map((a) => `${a.id}${a.enabled ? '' : '(停用)'}`).join('/') || '无';
    const v = window.prompt(`绑定 Agent（可用：${names}）：`, t.agentId);
    if (v === null) return;
    try {
      await api(`/api/tasks/${encodeURIComponent(t.id)}/agent`, {
        method: 'PATCH',
        body: JSON.stringify({ channel: u.channel, userId: u.userId, agentId: v.trim() }),
      });
      await refresh();
    } catch (e) { pushError(`修改 Agent 失败：${e.message}`); }
  }

  async function toggleKey(u, t) {
    try {
      await api(`/api/tasks/${encodeURIComponent(t.id)}`, {
        method: 'PATCH',
        body: JSON.stringify({ channel: u.channel, userId: u.userId, keyEnabled: !(t.keyEnabled !== false) }),
      });
      await refresh();
    } catch (e) { pushError(`切换 key 失败：${e.message}`); }
  }

  async function activateTask(u, t) {
    try {
      await api(`/api/tasks/${encodeURIComponent(t.id)}/activate`, {
        method: 'PATCH',
        body: JSON.stringify({ channel: u.channel, userId: u.userId }),
      });
      await refresh();
    } catch (e) { pushError(`激活失败：${e.message}`); }
  }

  async function removeTask(u, t) {
    if (!window.confirm(`确定删除任务「${t.name}」？此操作不可恢复。`)) return;
    try {
      await api(`/api/tasks/${encodeURIComponent(t.id)}?${new URLSearchParams({ channel: u.channel, userId: u.userId })}`, { method: 'DELETE' });
      if (isActiveTask(u, t)) {
        state.taskMode = false;
        state.ctx = { channel: '', userId: '', task: '', agent: '', key: '' };
      }
      await refresh();
    } catch (e) { pushError(`删除失败：${e.message}`); }
  }

  /* ---------- 渲染 ---------- */
  function renderAgents() {
    els.agents.innerHTML = '';
    for (const a of state.agents) els.agents.appendChild(agentCard(a));
  }

  function agentCard(a) {
    const card = document.createElement('div');
    card.className = `agent ${a.id === state.activeId ? 'active' : ''} ${a.enabled ? 'enabled' : 'disabled'}`;

    const top = document.createElement('div');
    top.className = 'agent-top';
    const name = document.createElement('span');
    name.className = 'agent-name';
    name.textContent = a.displayName;
    const pill = document.createElement('span');
    pill.className = 'type-pill';
    pill.textContent = a.type;
    const st = document.createElement('span');
    st.className = 'state-pill';
    st.textContent = a.enabled ? '启用' : '停用';
    top.append(name, pill, st);

    const desc = document.createElement('div');
    desc.className = 'agent-desc';
    desc.textContent = a.description || (a.model ? `默认模型：${a.model}` : '默认模型跟随 agent 自身');

    const row = document.createElement('div');
    row.className = 'model-row';
    const sel = document.createElement('select');
    sel.title = '切换该 Agent 的会话模型（仅内存，重启还原）';
    const current = a.model || '';
    const optDefault = document.createElement('option');
    optDefault.value = '';
    optDefault.textContent = '（不指定 → 由 agent 自行决定）';
    sel.appendChild(optDefault);
    if (current) {
      const cur = document.createElement('option');
      cur.value = current;
      cur.textContent = `${current}（当前）`;
      sel.appendChild(cur);
    }
    const cands = state.candidates[a.id] || [];
    if (cands.length) {
      const group = document.createElement('optgroup');
      group.label = '本机可用模型';
      for (const m of cands) {
        if (m === current) continue;
        const o = document.createElement('option');
        o.value = m;
        o.textContent = m;
        group.appendChild(o);
      }
      sel.appendChild(group);
    }
    sel.value = current;
    const applyBtn = document.createElement('button');
    applyBtn.className = 'btn primary';
    applyBtn.textContent = '应用模型';
    applyBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      await applyModel(a.id, sel.value, applyBtn);
    });
    row.append(sel, applyBtn);

    const foot = document.createElement('div');
    foot.className = 'agent-foot';
    const note = document.createElement('span');
    note.className = 'note';
    note.textContent = a.enabled ? '点击卡片开始对话' : '已停用，无法对话';
    foot.appendChild(note);

    card.append(top, desc, row, foot);
    card.addEventListener('click', () => {
      if (!a.enabled) return;
      state.activeId = a.id;
      renderAgents();
      updateContextMeta();
      clearMessages(`已切换到 agent:${a.id}（oneshot 会话）`);
    });
    return card;
  }

  async function applyModel(id, value, btn) {
    const m = value === '' ? null : value;
    const agent = state.agents.find((x) => x.id === id);
    if (agent && (agent.model || null) === m) return;
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '…';
    try {
      const res = await api(`/api/agents/${id}`, { method: 'PATCH', body: JSON.stringify({ model: m }) });
      const i = state.agents.findIndex((x) => x.id === res.agent.id);
      if (i >= 0) state.agents[i] = res.agent;
      renderAgents();
      updateContextMeta();
    } catch (e) {
      pushError(`应用模型失败：${e.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  function updateContextMeta() {
    if (state.taskMode) {
      const { channel, userId, task, agent, key } = state.ctx;
      els.ctxBadge.textContent = key
        ? `任务上下文：key:${key}${agent ? ` · ${agent}` : ''}`
        : `任务上下文：${channel}/${userId}${task ? ` · ${task}` : ''}${agent ? ` · ${agent}` : ''}`;
      els.ctxBadge.className = 'task';
    } else {
      els.ctxBadge.textContent = '全局（未绑定用户任务）';
      els.ctxBadge.className = 'legacy';
    }
    const a = state.agents.find((x) => x.id === state.activeId);
    if (!a) {
      els.activeAgentId.textContent = '-';
      els.activeModelValue.textContent = '-';
      els.composerHint.textContent = '选择左侧 Agent 后开始对话';
      els.sendBtn.disabled = true;
      return;
    }
    els.activeAgentId.textContent = a.id;
    els.activeModelValue.textContent = a.model || 'agent 默认';
    els.composerHint.textContent = state.taskMode
      ? (a.enabled ? '任务路由：消息发往持久任务会话（侧栏任务或 URL key/三元素，有记忆）' : '该 Agent 已停用，请选择其他 Agent')
      : (a.enabled ? 'oneshot 无状态会话：消息发往所选 Agent（不带 channel/userId）' : '该 Agent 已停用，请选择其他 Agent');
    els.sendBtn.disabled = !a.enabled;
  }

  /* ---------- 对话 ---------- */
  function appendMessage(role, content) {
    const empty = els.messages.querySelector('.empty-hint');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '我' : 'AI';

    const body = document.createElement('div');
    body.className = 'msg-body';
    const who = document.createElement('div');
    who.className = 'who';
    const whoName = document.createElement('span');
    whoName.className = 'who-name';
    whoName.dataset.role = role;
    whoName.textContent = role === 'user' ? '你' : (state.taskMode ? `task:${state.ctx.key || state.ctx.task || state.activeId}` : `agent:${state.activeId}`);
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    who.append(whoName, time);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'user') bubble.textContent = content;
    else bubble.dataset.assistant = '1';

    body.append(who, bubble);
    wrap.append(avatar, body);
    els.messages.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  function streamInto(bubble, kind, delta) {
    let node = bubble.querySelector(`[data-stream="${kind}"]`);
    if (!node) {
      node = document.createElement('div');
      node.dataset.stream = kind;
      if (kind === 'reasoning') {
        node.className = 'thinking';
        node.appendChild(Object.assign(document.createElement('div'), { className: 'thinking-hint', textContent: '思考过程' }));
      }
      if (kind === 'content') {
        const text = document.createElement('div');
        text.dataset.body = '1';
        node.appendChild(text);
      }
      bubble.appendChild(node);
    }
    const body = kind === 'reasoning' ? node : node.querySelector('[data-body="1"]');
    body.textContent += delta;
    scrollBottom();
  }

  function scrollBottom() {
    els.messages.scrollTop = els.messages.scrollHeight;
  }
  function pushError(msg) {
    const empty = els.messages.querySelector('.empty-hint');
    if (empty) empty.remove();
    let line = els.messages.querySelector('.error-line');
    if (!line) {
      line = document.createElement('div');
      line.className = 'error-line';
      els.messages.appendChild(line);
    }
    line.textContent = msg;
    scrollBottom();
  }
  function clearError() {
    const line = els.messages.querySelector('.error-line');
    if (line) line.remove();
  }
  function clearMessages(hint) {
    if (state.busy) { state.aborter?.abort(); }
    els.messages.innerHTML = `<div class="empty-hint"><div class="big">${esc(hint || '会话已清空')}</div><div>选择左侧 Agent 开始新一轮对话</div></div>`;
  }

  async function send() {
    const text = els.input.value.trim();
    if (state.busy) {
      state.aborter?.abort();
      return;
    }
    const a = state.agents.find((x) => x.id === state.activeId);
    if (!a || !a.enabled) return;
    if (!text) return;
    clearError();

    const history = collectedHistory();
    appendMessage('user', text);
    els.input.value = '';
    autoGrow();

    const wrap = appendMessage('assistant', '');
    const bubble = wrap.querySelector('.bubble');
    state.busy = true;
    els.sendBtn.disabled = true;
    els.sendBtn.textContent = '停止';
    const model = `agent:${a.id}`;

    const aborter = new AbortController();
    state.aborter = aborter;

    let full = '';
    try {
      const body = {
        model,
        stream: true,
        messages: history.concat([{ role: 'user', content: text }]),
      };
      // 任务路由模式：key 单 key 直连（不带三元素）；无 key 时带 channel/userId/task/agent，服务端派生持久会话 sessionKey
      if (state.taskMode) {
        if (state.ctx.key) {
          body.taskKey = state.ctx.key;
          if (state.ctx.agent) body.agent = state.ctx.agent;
        } else {
          body.channel = state.ctx.channel;
          body.userId = state.ctx.userId;
          if (state.ctx.task) body.task = state.ctx.task;
          if (state.ctx.agent) body.agent = state.ctx.agent;
        }
      }
      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        signal: aborter.signal,
        headers: {
          'Content-Type': 'application/json',
          ...(state.keys.apiKey ? { Authorization: `Bearer ${state.keys.apiKey}` } : {}),
        },
        body: JSON.stringify(body),
      });
      if (res.status === 401) {
        await promptApiKey();
        throw new Error('鉴权失败，请重试发送');
      }
      if (!res.ok) {
        let msg = `${res.status}`;
        try { const j = await res.json(); msg = j?.error?.message || msg; } catch {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          let j;
          try { j = JSON.parse(payload); } catch { continue; }
          if (j.error) throw new Error(j.error.message || 'agent 流式返回错误');
          const choice = j.choices && j.choices[0];
          if (!choice) continue;
          const d = choice.delta || {};
          if (typeof d.reasoning_content === 'string' && d.reasoning_content) streamInto(bubble, 'reasoning', d.reasoning_content);
          if (typeof d.content === 'string' && d.content) {
            streamInto(bubble, 'content', d.content);
            full += d.content;
          }
          if (choice.finish_reason) break;
        }
      }
      if (!full && !bubble.querySelector('[data-stream]')) {
        bubble.textContent = '（agent 未返回内容）';
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        const t = bubble.querySelector('[data-stream="content"] [data-body="1"]');
        if (t) t.textContent += '\n\n[已停止]';
        else bubble.textContent = '[已停止]';
      } else {
        pushError(`请求失败：${e.message}`);
      }
    } finally {
      state.busy = false;
      state.aborter = null;
      els.sendBtn.textContent = '发送';
      updateContextMeta();
    }
  }

  function collectedHistory() {
    const out = [];
    for (const node of els.messages.querySelectorAll('.msg')) {
      const role = node.querySelector('.who-name')?.dataset.role;
      if (role === 'user') {
        const b = node.querySelector('.bubble');
        out.push({ role: 'user', content: b ? b.textContent : '' });
      } else if (role === 'assistant') {
        const content = node.querySelector('[data-stream="content"] [data-body="1"]')?.textContent || '';
        if (content) out.push({ role: 'assistant', content });
      }
    }
    return out;
  }

  /* ---------- 输入交互 ---------- */
  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 180) + 'px';
  }
  els.input.addEventListener('input', autoGrow);
  els.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  els.clearBtn.addEventListener('click', () => { clearMessages(); });
  els.sendBtn.addEventListener('click', () => send());
  els.agentsRefresh.addEventListener('click', async () => {
    els.agentsRefresh.disabled = true;
    try { await refresh(); } catch (e) { pushError(`刷新失败：${e.message}`); }
    finally { els.agentsRefresh.disabled = false; }
  });
  els.taskExpandBtn.addEventListener('click', () => setCollapsed(false));
  els.taskRefreshBtn.addEventListener('click', async () => {
    els.taskRefreshBtn.disabled = true;
    try { await refresh(); } catch (e) { pushError(`刷新任务失败：${e.message}`); }
    finally { els.taskRefreshBtn.disabled = false; }
  });
  els.taskNewBtn.addEventListener('click', () => {
    const u = taskUser();
    if (u) { newTask(u); return; }
    const expanded = state.users.find((x) => userKey(x) === state.expanded);
    if (expanded) { newTask(expanded); return; }
    pushError('请先展开一个用户分组，再新建任务');
  });
  // 用户过滤：按渠道 / 用户 ID 实时过滤（input 同时覆盖 type=search 的原生清除）
  els.taskFilter.addEventListener('input', () => renderTasks());

  /* ---------- 启动 ---------- */
  async function boot() {
    els.health.textContent = '连接中…';
    els.health.className = 'badge';
    try {
      await refresh();
      // 任务上下文：URL 为单 key 直连时，反查归属用户以锁定任务面板
      if (state.taskMode && state.ctx.key && !state.ctx.channel) {
        try {
          const ref = await api(`/api/tasks/by-key/${encodeURIComponent(state.ctx.key)}`);
          if (ref?.channel) {
            state.ctx.channel = ref.channel;
            state.ctx.userId = ref.userId;
            if (ref.task) { state.ctx.task = ref.task.id; state.ctx.agent = ref.task.agentId; }
          }
        } catch { /* 反查失败保持原样，发送时服务端会返回明确错误 */ }
      }
      // 任务上下文：URL 指定了 agent 时预选该 agent（优先启用中的）
      if (state.taskMode && state.ctx.agent) {
        const target = state.agents.find((x) => x.id === state.ctx.agent && x.enabled);
        if (target) { state.activeId = target.id; renderAgents(); }
      }
      // 任务上下文：锁定任务面板到归属用户分组
      if (state.taskMode && state.ctx.channel) {
        const lock = state.users.find((u) => u.channel === state.ctx.channel && u.userId === state.ctx.userId);
        if (lock) state.expanded = userKey(lock);
      }
      renderTasks();
      updateContextMeta();
      if (state.taskMode) {
        const hint = state.ctx.key
          ? `已进入任务上下文：key:${state.ctx.key}（任务路由，有记忆）`
          : `已进入任务上下文：${state.ctx.channel}/${state.ctx.userId}${state.ctx.task ? ` · task:${state.ctx.task}` : ''}（任务路由，有记忆）`;
        clearMessages(hint);
      }
      els.health.textContent = '已连接';
      els.health.className = 'badge ok';
    } catch (e) {
      els.health.textContent = '连接失败';
      els.health.className = 'badge err';
      pushError(`无法加载 Agent 列表：${e.message}`);
    }
  }
  boot();
})();
</script>
</body>
</html>
